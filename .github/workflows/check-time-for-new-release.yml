name: Time for new release

on:
  push:
    paths:
    - .github/workflows/check-time-for-new-release.yml
    
  workflow_dispatch:

permissions:
  contents: read
  # The called workflow declares `issues: write` (it opens a release-reminder issue);
  # without granting it here the run is a startup_failure.
  issues: write

jobs:
  check-time-for-new-release:
    uses: devops-actions/.github/.github/workflows/time-for-new-release.yml@f2b5c26c77264c245360c3f1f2d279947cc86503 # v1.2.0
