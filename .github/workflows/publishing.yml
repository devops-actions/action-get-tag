name: Publishing the action to the marketplace

on:   
  push:
    tags:
      - 'v*' # Push events to matching v*, i.e. v1.0, v20.15.10

  workflow_dispatch:
    
# Declare default GITHUB_TOKEN permissions as read only.
permissions: read-all
    
jobs:
  test-local-action:
    runs-on: ubuntu-latest
    steps: 
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Run from main.js
        id: tag_dev
        run: |
          # The runner uses `bash -e`, so capture the exit codes of the expected failures
          # instead of letting the first one end the step (same fix as test.yml in #119).
          set +e
          GITHUB_REF="" node main.js
          EXIT_CODE=$?
          if [ $EXIT_CODE -ne 1 ]; then echo "Expected failure on no GITHUB_REF set"; fi

          GITHUB_REF=origin/refs/tag/v1 node main.js
          EXIT_CODE=$?
          if [ $EXIT_CODE -ne 1 ]; then echo "Expected failure on invalid ref"; fi

          GITHUB_REF=refs/tag/v1 node main.js
          EXIT_CODE=$?
          if [ $EXIT_CODE -ne 0 ]; then echo "Not expected a failure on valid ref to tag"; fi

          GITHUB_REF=refs/heads/main node main.js
          EXIT_CODE=$?
          if [ $EXIT_CODE -ne 0 ]; then echo "Not expected a failure on valid ref to branch"; fi
          set -e

          GITHUB_REF=refs/tags/v1.0.0 node main.js
          # shellcheck disable=SC2181
          if [ $? -ne 0 ]; then echo "Not expected a failure on valid ref with minor version"; fi
          
      - name: Test dev
        run: |
          test "v1.0.0" = "${{steps.tag_dev.outputs.tag}}"
          
      - name: Run dev with strip v
        id: tag_dev_strip_v
        run: GITHUB_REF=refs/tags/v1.0.0 INPUT_STRIP_V=true node main.js
        
      - name: Test dev with strip v
        run: |
          test "1.0.0" = "${{steps.tag_dev_strip_v.outputs.tag}}"
          
      - name: Run from action.yml
        id: tag_prod
        if: startsWith(github.ref, 'refs/tags') == true
        uses: ./
        
      - name: Test output from action.yml
        if: startsWith(github.ref, 'refs/tags') == true
        run: |
          test -n "${{steps.tag_prod.outputs.tag}}"

  release:
    name: Release with SBOM and attestations
    needs: test-local-action
    # Creates the GitHub release for this tag with the action files, a source archive and
    # SPDX/CycloneDX SBOMs attached, each with a verified artifact attestation.
    permissions:
      contents: write       # create the release and upload its assets
      id-token: write       # Sigstore keyless signing for the attestations
      attestations: write   # store the attestations
    uses: devops-actions/.github/.github/workflows/rw-release-attestation.yml@f2b5c26c77264c245360c3f1f2d279947cc86503 # v1.2.0
